<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Summary Cards</title>
    <link rel="stylesheet" href="card_styles.css">
</head>
<body>
    <h1>Company Financial Summary</h1>
    <div class="card-container">
        <div class="financial-card">
            <h2>Total Revenue</h2>
            <p class="value">IDR 15,000,000</p>
        </div>
        <div class="financial-card">
            <h2>Total Expenses</h2>
            <p class="value">IDR 8,000,000</p>
        </div>
        <div class="financial-card">
            <h2>Net Profit</h2>
            <p class="value">IDR 7,000,000</p>
        </div>
    </div>
</body>
</html>
