<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internal Quality Audit Form</title>
</head>
<body>

    <h1>Internal Quality Audit Form</h1>

    <form method="POST" action="#" enctype="multipart/form-data">

        <fieldset>
            <legend>Audit Information</legend>

            <label for="auditorName">Auditor Name:</label><br>
            <input type="text" id="auditorName" name="auditorName"
                   placeholder="Enter auditor name">
            <br><br>

            <label for="auditDate">Audit Date:</label><br>
            <input type="date" id="auditDate" name="auditDate">
            <br><br>

            <label for="department">Department Audited:</label><br>
            <select id="department" name="department">
                <option value="finance">Finance</option>
                <option value="production">Production</option>
                <option value="marketing">Marketing</option>
                <option value="hrd">HRD</option>
            </select>
            <br><br>

            <label>Audit Type:</label><br>

            <input type="radio" id="internal" name="auditType" value="internal">
            <label for="internal">Internal</label>

            <input type="radio" id="external" name="auditType" value="external">
            <label for="external">External</label>

        </fieldset>

        <br>

        <fieldset>
            <legend>Assessment Areas</legend>

            <fieldset>
                <legend>Documentation Compliance</legend>

                <label>Are documents complete and up-to-date?</label><br>

                <input type="radio" id="docYes" name="documentationCompliance" value="yes">
                <label for="docYes">Yes</label>

                <input type="radio" id="docNo" name="documentationCompliance" value="no">
                <label for="docNo">No</label>

                <br><br>

                <label for="docNotes">Additional Notes:</label><br>
                <textarea id="docNotes" name="docNotes"
                          rows="4" cols="40"
                          placeholder="Enter additional notes"></textarea>

            </fieldset>

            <br>

            <fieldset>
                <legend>Procedure Compliance</legend>

                <label>Are procedures followed correctly?</label><br>

                <input type="radio" id="procedureYes" name="procedureCompliance" value="yes">
                <label for="procedureYes">Yes</label>

                <input type="radio" id="procedureNo" name="procedureCompliance" value="no">
                <label for="procedureNo">No</label>

                <br><br>

                <label for="complianceScore">Compliance Score (1-5):</label><br>
                <input type="number" id="complianceScore"
                       name="complianceScore"
                       min="1" max="5">

            </fieldset>

            <br>

            <fieldset>
                <legend>Identification of Non-conformities</legend>

                <label>Select Non-conformities:</label><br>

                <input type="checkbox"
                       id="minor"
                       name="nonConformity[]"
                       value="minor">
                <label for="minor">Minor</label>
                <br>

                <input type="checkbox"
                       id="major"
                       name="nonConformity[]"
                       value="major">
                <label for="major">Major</label>
                <br>

                <input type="checkbox"
                       id="critical"
                       name="nonConformity[]"
                       value="critical">
                <label for="critical">Critical</label>

                <br><br>

                <label for="nonConformityDescription">
                    Description:
                </label><br>

                <textarea id="nonConformityDescription"
                          name="nonConformityDescription"
                          rows="5"
                          cols="40"
                          placeholder="Describe the non-conformities"></textarea>

            </fieldset>

        </fieldset>

        <br>

        <label for="evidence">Upload Supporting Evidence:</label><br>
        <input type="file" id="evidence" name="evidence">

        <br><br>

        <input type="submit" value="Submit Audit Form">
        <input type="reset" value="Reset">

    </form>

</body>
</html>
