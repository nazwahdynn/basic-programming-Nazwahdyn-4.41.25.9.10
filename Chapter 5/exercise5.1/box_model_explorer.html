<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Box Model Exploration</title>
        <link rel="stylesheet" href="box_styles.css">
    </head>
    <body>
        <h1>CSS Box Model Exploration</h1>
        <div class="box" id="box1">Box 1 (content-box)</div>

            <span class="inline-block-span">inline-block span</span>.
        </p>
