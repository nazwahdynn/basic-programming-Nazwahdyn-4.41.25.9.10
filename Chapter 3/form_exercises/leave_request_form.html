<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leave Request Form</title>
</head>
<body>

    <h1>Employee Leave Request Form</h1>

    <form method="POST" action="#">

        <fieldset>
            <legend>Employee Information</legend>

            <label for="employeeName">Employee Name:</label><br>
            <input type="text" id="employeeName" name="employeeName"
                   placeholder="Employee's full name" required>
            <br><br>

            <label for="employeeId">Employee ID:</label><br>
            <input type="text" id="employeeId" name="employeeId"
                   placeholder="Employee ID/NIK" required>
            <br><br>

        </fieldset>

        <br>

        <fieldset>
            <legend>Leave Details</legend>

            <label for="leaveType">Type of Leave:</label><br>
            <select id="leaveType" name="leaveType">
                <option value="annual">Annual Leave</option>
                <option value="sick">Sick Leave</option>
                <option value="maternity">Maternity Leave</option>
                <option value="other">Other Important Leave</option>
            </select>
            <br><br>

            <label for="startDate">Leave Start Date:</label><br>
            <input type="date" id="startDate" name="startDate" required>
            <br><br>

            <label for="endDate">Leave End Date:</label><br>
            <input type="date" id="endDate" name="endDate" required>
            <br><br>

            <label for="reason">Reason for Leave:</label><br>
            <textarea id="reason" name="reason" rows="5" cols="40"
                      placeholder="Enter your reason for leave"></textarea>
            <br><br>

            <label>Supporting Documents:</label><br>

            <input type="checkbox" id="doctor" name="documents[]" value="doctor">
            <label for="doctor">Doctor's Certificate</label>
            <br>

            <input type="checkbox" id="family" name="documents[]" value="family">
            <label for="family">Family Statement</label>
            <br>

            <input type="checkbox" id="other" name="documents[]" value="other">
            <label for="other">Other</label>
            <br><br>

        </fieldset>

        <br>

        <input type="submit" value="Submit Leave Request">
        <input type="reset" value="Reset">

    </form>

</body>
</html>
